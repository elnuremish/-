<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ODYSSEY SYNTH // ARCHIVE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #030303;
      color: #f4f4f4;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      cursor: crosshair;
    }

    .grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    #glow {
      position: fixed;
      width: 500px;
      height: 500px;
      left: 0;
      top: 0;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      background: radial-gradient(
        circle,
        rgba(255,255,255,.1),
        rgba(255,255,255,0) 60%
      );
      transition: transform 2s cubic-bezier(.1,1,.1,1);
    }

    body.playing #glow {
      transform: translate(-50%, -50%) scale(1);
    }

    #dvd {
      position: fixed;
      width: 140px;
      pointer-events: none;
    }

    .info {
      position: fixed;
      left: 40px;
      bottom: 40px;
      max-width: 580px;
      pointer-events: none;
    }

    h1 {
      margin: 0 0 15px;
      font-size: 20px;
      line-height: 1;
      letter-spacing: -.5px;
    }

    p {
      margin: 0;
      font-size: 14px;
      line-height: 1.4;
      opacity: .8;
    }
  </style>
</head>

<body>
  <div class="grid"></div>
  <div id="glow"></div>

  <svg id="dvd" viewBox="0 0 200 100">
    <ellipse cx="100" cy="50" rx="90" ry="35"
      fill="none" stroke="#fff" stroke-width="3"/>
    <text x="100" y="55"
      font-size="28"
      font-weight="900"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      fill="#fff">
      DVD
    </text>
  </svg>

  <div class="info">
    <h1>СИНТЕЗАТОР ODYSSEY</h1>
    <p>
      Зажми ЛКМ на сетке или используй клавиши (A-L, Z-C).
      Ось X — высота звука и резонанс. Ось Y — срез фильтра.
    </p>
  </div>

  <script>
    // -------------------------
    // DVD
    // -------------------------

    const dvd = document.querySelector("#dvd");

    let dvdX = Math.random() * (innerWidth - 140);
    let dvdY = Math.random() * (innerHeight - 100);
    let dvdDX = 1.2;
    let dvdDY = 1.2;

    function moveDvd() {
      if (dvdX <= 0 || dvdX >= innerWidth - 140) dvdDX *= -1;
      if (dvdY <= 0 || dvdY >= innerHeight - 100) dvdDY *= -1;

      dvdX += dvdDX;
      dvdY += dvdDY;

      dvd.style.transform = `translate(${dvdX}px, ${dvdY}px)`;
      requestAnimationFrame(moveDvd);
    }

    moveDvd();

    // -------------------------
    // AUDIO
    // -------------------------

    let audio;
    let filter;
    let master;
    let delay;

    const sounds = new Map();
    const glow = document.querySelector("#glow");

    const notes = [
      32.7, 38.89, 43.65, 49,
      58.27, 65.41, 77.78, 87.31,
      98, 116.54, 130.81, 155.56,
      174.61, 196
    ];

    const keys = {
      a: 0, s: 1, d: 2, f: 3, g: 4, h: 5, j: 6,
      k: 7, l: 8, ";": 9, "'": 10, z: 11, x: 12, c: 13
    };

    function startAudio() {
      if (audio) return;

      audio = new (window.AudioContext || window.webkitAudioContext)();

      filter = audio.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 800;
      filter.Q.value = 1.5;

      master = audio.createGain();
      master.gain.value = .3;

      delay = audio.createDelay(4);
      delay.delayTime.value = .75;

      const feedback = audio.createGain();
      feedback.gain.value = .6;

      delay.connect(feedback);
      feedback.connect(delay);

      filter.connect(master);
      master.connect(audio.destination);
      master.connect(delay);
      delay.connect(audio.destination);

      // Небольшое автоматическое движение фильтра
      const lfo = audio.createOscillator();
      const lfoAmount = audio.createGain();

      lfo.frequency.value = .15;
      lfoAmount.gain.value = 300;

      lfo.connect(lfoAmount);
      lfoAmount.connect(filter.frequency);
      lfo.start();
    }

    function updateSound(x, y) {
      if (!audio) return;

      const vertical = 1 - y / innerHeight;
      const horizontal = x / innerWidth;

      filter.frequency.setTargetAtTime(
        100 + vertical * 4000,
        audio.currentTime,
        .1
      );

      filter.Q.setTargetAtTime(
        1 + horizontal * 15,
        audio.currentTime,
        .1
      );
    }

    function moveGlow(x, y) {
      glow.style.left = `${x}px`;
      glow.style.top = `${y}px`;
    }

    function playNote(freq, id, x, y) {
      startAudio();
      audio.resume();

      document.body.classList.add("playing");
      moveGlow(x, y);
      updateSound(x, y);

      const volume = audio.createGain();
      volume.gain.setValueAtTime(0, audio.currentTime);
      volume.gain.linearRampToValueAtTime(
        .4,
        audio.currentTime + 3
      );

      volume.connect(filter);

      const osc1 = audio.createOscillator();
      const osc2 = audio.createOscillator();
      const sub = audio.createOscillator();

      osc1.type = "sawtooth";
      osc2.type = "sawtooth";
      sub.type = "square";

      osc1.frequency.value = freq;
      osc2.frequency.value = freq * 1.015;
      sub.frequency.value = freq / 2;

      osc1.connect(volume);
      osc2.connect(volume);
      sub.connect(volume);

      osc1.start();
      osc2.start();
      sub.start();

      sounds.set(id, { osc1, osc2, sub, volume });
    }

    function stopNote(id) {
      const sound = sounds.get(id);
      if (!sound || !audio) return;

      sound.volume.gain.cancelScheduledValues(audio.currentTime);
      sound.volume.gain.linearRampToValueAtTime(
        0,
        audio.currentTime + 6
      );

      setTimeout(() => {
        sound.osc1.stop();
        sound.osc2.stop();
        sound.sub.stop();

        sound.osc1.disconnect();
        sound.osc2.disconnect();
        sound.sub.disconnect();
        sound.volume.disconnect();
      }, 7000);

      sounds.delete(id);

      if (!sounds.size) {
        document.body.classList.remove("playing");
      }
    }

    // -------------------------
    // MOUSE / POINTER
    // -------------------------

    document.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;

      const index = Math.min(
        notes.length - 1,
        Math.floor(e.clientX / innerWidth * notes.length)
      );

      playNote(notes[index], `pointer-${e.pointerId}`, e.clientX, e.clientY);
    });

    document.addEventListener("pointermove", e => {
      moveGlow(e.clientX, e.clientY);

      if (sounds.size) {
        updateSound(e.clientX, e.clientY);
      }
    });

    document.addEventListener("pointerup", e => {
      stopNote(`pointer-${e.pointerId}`);
    });

    document.addEventListener("pointercancel", e => {
      stopNote(`pointer-${e.pointerId}`);
    });

    // -------------------------
    // KEYBOARD
    // -------------------------

    document.addEventListener("keydown", e => {
      const key = e.key.toLowerCase();

      if (keys[key] === undefined || sounds.has(key)) return;

      playNote(
        notes[keys[key]],
        key,
        innerWidth / 2,
        innerHeight / 2
      );
    });

    document.addEventListener("keyup", e => {
      const key = e.key.toLowerCase();

      if (keys[key] !== undefined) {
        stopNote(key);
      }
    });

    // Если окно изменило размер — не оставляем DVD за экраном
    window.addEventListener("resize", () => {
      dvdX = Math.min(dvdX, Math.max(0, innerWidth - 140));
      dvdY = Math.min(dvdY, Math.max(0, innerHeight - 100));
    });
  </script>
</body>
</html>
